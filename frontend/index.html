<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Monitor (htop clone)</title>
  </head>
  <body>
    <div class="dashboard">
      <header>
        <h1>[ System Resource Monitor ]</h1>
        <div class="status-indicator">
          <span id="connection-status" class="offline">Отключен</span>
        </div>
      </header>

      <main class="grid-container">
        <section class="card">
          <h2>CPU Usage</h2>
          <div id="cpu-container" class="cores-grid">
            </div>
        </section>

        <section class="card">
          <h2>Memory Usage</h2>
          <div class="ram-stats">
            <div class="bar-container">
              <span class="label">RAM</span>
              <progress id="ram-progress" max="100" value="0"></progress>
              <span id="ram-text" class="value">0%</span>
            </div>
            <div class="details">
              <p>Total: <span id="ram-total">0</span> GB</p>
              <p>Available: <span id="ram-available">0</span> GB</p>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Battery Status</h2>
          <div class="battery-stats">
            <div class="stat-row">
              <span class="label">Level:</span>
              <span id="battery-level" class="value">-</span>
            </div>
            <div class="stat-row">
              <span class="label">Status:</span>
              <span id="battery-status" class="value">-</span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
